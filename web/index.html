<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2ef">
<title>Prenúncio, an early warning for the Amazon</title>
<meta name="description" content="Where the Amazon forest will be cleared, burned, degraded or mined next, and how hard the pressure is now. Every past forecast can be checked against what happened.">
<link rel="canonical" href="https://prenuncio.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prenúncio">
<meta property="og:url" content="https://prenuncio.com/">
<meta property="og:title" content="Prenúncio, an early warning for the Amazon">
<meta property="og:description" content="Where the forest will be cleared, burned, degraded or mined next, and how hard the pressure is now.">
<meta property="og:image" content="https://prenuncio.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prenúncio. The Legal Amazon drawn on a white field, with the cells flagged for clearing in violet.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="col">
    <header id="top">
      <div class="brand"><svg viewBox="0 0 20 18" aria-hidden="true"><path d="M10 0L20 18H0z"/></svg>Prenúncio</div>
      <nav>
        <button id="about-btn"></button>
        <button id="lang-btn"></button>
      </nav>
    </header>
    <div id="hazard" role="group"></div>

    <div id="lead">
      <div id="level"></div>
      <p id="scope"></p>
      <h1 id="say" aria-live="polite"></h1>
      <p id="sub"></p>
    </div>

    <div id="body">
      <div id="bar">
        <div id="scale" role="group"></div>
        <div id="ahead" role="group"></div>
        <div id="step"><button data-d="-1">‹</button><span></span><button data-d="1">›</button></div>
      </div>
      <div id="chart"></div>
      <p id="hint"></p>
      <div id="signs"></div>
    </div>
  </section>

  <section id="stage">
    <div id="map"></div>
    <div id="mapctl">
      <div id="modes" role="group"></div>
      <div id="kinds" role="group"></div>
    </div>
    <p id="share"></p>
    <p id="legend"></p>
    <p id="credit" hidden></p>
  </section>

  <div id="views" role="group"></div>
</main>

<dialog id="about">
  <button id="about-close"></button>
  <div id="about-body"></div>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
