<!doctype html>
<html lang="en" data-story-version="4">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<title>Prenúncio, an early warning for the Amazon</title>
<meta name="description" content="Where the Amazon forest will be cleared, burned, degraded or mined next, and how hard the pressure is now. Every past forecast can be checked against what happened.">
<link rel="canonical" href="https://prenuncio.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate" type="text/plain" href="/llms.txt" title="API instructions for agents">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prenúncio">
<meta property="og:url" content="https://prenuncio.com/">
<meta property="og:title" content="Prenúncio, an early warning for the Amazon">
<meta property="og:description" content="Where the forest will be cleared, burned, degraded or mined next, and how hard the pressure is now.">
<meta property="og:image" content="https://prenuncio.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prenúncio. The Amazon drawn in forest green, with the cells most likely to be cleared in red.">
<meta name="twitter:card" content="summary_large_image">
<script>
// The opening story plays on a first visit to the bare address. A link with a fragment goes straight to the
// tool, and so does ?story=0; ?story=1 plays it again. Decided here, before the first paint, so the tool is
// never flashed whole and then taken apart: data-story is on, and data-has, the list of the pieces of the
// interface the story has brought in so far, is empty. The version is part of the key: a rewritten story is
// shown once more.
(function () {
  var root = document.documentElement, q = new URLSearchParams(location.search).get("story"), seen = null;
  try { seen = localStorage.getItem("story"); } catch (e) {}
  if (q === "1" || (q !== "0" && location.hash.length < 2 && seen !== root.dataset.storyVersion)) root.dataset.story = root.dataset.has = "";
})();
</script>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path class="f" d="M0 0H100V100H0Z"/><path class="c" d="M100 34C84 40 88 60 70 65C52 70 50 86 42 100H100Z"/><path class="g" d="M100 34C84 40 88 60 70 65C52 70 50 86 42 100" fill="none" stroke="#f4f5f0" stroke-width="7"/></svg>Prenúncio</div>
  <nav id="nav">
    <button id="story-btn"></button>
    <button id="about-btn"></button>
    <button id="api-btn">API</button>
    <button id="lang-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu"></button>
  </nav>
  <div id="lang-menu" role="menu" hidden></div>
  <button id="skip-btn"></button>
  <button id="menu-btn" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 18 14" aria-hidden="true"><path d="M1 2h16M1 7h16M1 12h16"/></svg></button>
</header>

<main id="app">
  <!-- the map is the page. With the timeline on the stage it is a small picture of itself in the upper right corner. -->
  <section id="mapbox" class="box" data-as="stage">
    <div id="mapin" class="in"><div id="map"></div></div>
    <button id="map-front" class="front"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M12 12L3 3M3 9V3h6"/></svg></button>
  </section>

  <!-- what the map shows and how to read it -->
  <div id="mappanel">
    <div id="mapctl">
      <div id="modes" role="group"></div>
      <div id="kindrow"><div id="kinds" role="group"></div><button id="rank-btn"></button></div>
    </div>
    <div id="foot">
      <p id="legend"></p>
      <p id="share"></p>
    </div>
  </div>
  <p id="credit" hidden></p>

  <!-- the ranked list: where to look first, and why -->
  <aside id="list" hidden>
    <div id="list-bar"><button id="list-grab"><span id="list-title"></span></button><a id="list-csv" href="data/priority.csv" download></a><button id="list-close" class="x"></button></div>
    <div id="list-in">
      <p id="list-say"></p>
      <ol id="list-rows"></ol>
    </div>
  </aside>

  <!-- the bulletin and its timeline: which hazard, how bad, what to expect, month by month or year by year -->
  <section id="chartbox" class="box" data-as="dock">
    <div id="chartin" class="in">
      <button id="sheet-grab" aria-hidden="true" tabindex="-1"></button>
      <!-- the people of an Indigenous land that is selected take the timeline's place: a photograph, their name, a few lines -->
      <div id="people" class="people" hidden></div>
      <div id="hazrow">
        <div id="hazard" role="group"></div>
        <button id="chart-front" class="front"><svg class="out" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12L11 3M5 3h6v6"/></svg><svg class="shut" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
      </div>
      <div id="lead">
        <div id="level"></div>
        <p id="scope"></p>
        <h1 id="say" aria-live="polite"></h1>
        <p id="sub"></p>
      </div>
      <div id="body">
        <div id="bar">
          <div id="scale" role="group"></div>
          <div id="shape" role="group"></div>
          <div id="ahead" role="group"></div>
          <div id="step"><button data-d="-1">‹</button><span></span><button data-d="1">›</button></div>
        </div>
        <div id="chart"></div>
        <div id="under">
          <p id="hint"></p>
          <div id="signs"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- the opening story: a caption, one line at a time, while the interface is put together around the map.
     The way on and the way back are arrows. -->
<section id="story" hidden>
  <div id="story-text">
    <p id="story-line" aria-live="polite"></p>
    <div id="story-extra"></div>
  </div>
  <div id="story-nav">
    <ol id="story-marks" aria-hidden="true"></ol>
    <button id="story-back"><svg viewBox="0 0 26 16" aria-hidden="true"><path d="M25 8H2M9 1L2 8l7 7"/></svg></button>
    <button id="story-next"><svg viewBox="0 0 26 16" aria-hidden="true"><path d="M1 8h23M17 1l7 7-7 7"/></svg></button>
  </div>
</section>

<!-- About: what this is, the model, the benchmark. It takes the stage, and the map waits in its corner. -->
<dialog id="about">
  <div id="about-bar" class="pbar"><button id="about-close" class="x"></button></div>
  <div id="about-body"></div>
</dialog>

<!-- the API's instructions for agents: on the stage too -->
<dialog id="api">
  <div class="pbar"><button id="api-copy" class="x ico"><svg viewBox="0 0 14 14" aria-hidden="true"><path class="clip" d="M4.5 2.2H2.4v10.9h9.2V2.2H9.5M4.5 1h5v2.6h-5z"/><path class="ok" d="M1.5 7.5l3.7 3.7 7.3-7.9"/></svg></button><button id="api-close" class="x"></button><span id="api-said" class="sr" aria-live="polite"></span></div>
  <p id="api-top"><a id="api-base" href="api/v1/index.json">https://prenuncio.com/api/v1</a></p>
  <pre id="api-text"></pre>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
